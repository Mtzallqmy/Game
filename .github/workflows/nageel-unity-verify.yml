name: NAGEEL Unity 6 real 3D verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/nageel-unity-verify.yml'

permissions:
  contents: read

jobs:
  unity-editor:
    name: Generate scenes and run Unity EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    if: ${{ vars.NAGEEL_UNITY_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-NAGEEL-Unity6-${{ hashFiles('Packages/manifest.json') }}
      - name: Verify Unity license configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "Unity license not configured; cannot claim 3D test success."
            exit 1
          fi
      - name: Generate 3D scenes with actual Unity Editor
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          targetPlatform: Android
          buildMethod: Nageel.EditorTools.NageelRecoverySceneBuilder.Generate
          versioning: None
          allowDirtyBuild: true
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          testMode: EditMode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editmode-results
          path: artifacts
          if-no-files-found: warn

  android-apk:
    name: Unity ARM64 Android build (only after verified Editor tests)
    needs: unity-editor
    runs-on: ubuntu-latest
    timeout-minutes: 100
    if: ${{ vars.NAGEEL_UNITY_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build real Unity APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          targetPlatform: Android
          buildMethod: Nageel.EditorTools.NageelRecoverySceneBuilder.BuildAndroid
          versioning: None
          allowDirtyBuild: true
      - name: Confirm Unity generated a real APK
        run: |
          test -s Builds/NageelRecovery-arm64.apk || {
            echo "No Unity-built APK exists. Do not publish a Kotlin Canvas APK."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nageel-unity-recovery-arm64-unverified-device
          path: Builds/NageelRecovery-arm64.apk
          if-no-files-found: error
